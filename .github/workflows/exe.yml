name: Build gpu-backpack.exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/exe.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o gpu-backpack.exe ./cmd/backpack

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-backpack-windows-amd64
          path: gpu-backpack.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gpu-backpack.exe
